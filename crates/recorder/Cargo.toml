  [package]
  name = "recorder"
  version = "0.1.0"
  edition = "2021"

  [dependencies]
  venue-core = { path = "../venue-core" }
  wire = { path = "../wire" }
  chrono = "0.4"
  num-traits = "0.2"
  arrow = { version = "55", features = ["prettyprint"] }
  parquet = { version = "55", features = ["arrow"] }
  tracing = { workspace = true }

  [dev-dependencies]
  tempfile = "3"
  rust_decimal = "1"
  rust_decimal_macros = "1"